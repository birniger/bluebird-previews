<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bluebird Snowsports</title>
<style>
  :root { --bg: #faf9f5; --ink: #063e5f; --soft: #5b7686; --line: #dfe3e1; --hover: #eef3f3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1a22; --ink: #e8f1f4; --soft: #93a9b5; --line: #243643; --hover: #15262f; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 72px 16px; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
  p { color: var(--soft); margin: 6px 0 32px; }
  ul { list-style: none; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  a { display: flex; justify-content: space-between; padding: 18px 8px; color: inherit; text-decoration: none; }
  a::after { content: "→"; color: var(--soft); }
  a:hover, a:focus-visible { background: var(--hover); }
</style>
</head>
<body>
<main>
  <h1>Bluebird Snowsports</h1>
  <p>Website design options</p>
  <ul>
<!-- options -->
  </ul>
</main>
</body>
</html>
